<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#0747A6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7E6"/>
      <stop offset="100%" stop-color="#36B37E"/>
    </linearGradient>
  </defs>
  <!-- Card rounded background -->
  <rect x="4" y="8" width="40" height="28" rx="6" fill="url(#primaryGrad)"/>
  <!-- Card stripe -->
  <rect x="4" y="14" width="40" height="6" fill="#091E42" opacity="0.3"/>
  <!-- Card chip -->
  <rect x="10" y="24" width="8" height="6" rx="1.5" fill="#FFAB00"/>
  <!-- Adaptive Retry Circular Arrow -->
  <circle cx="36" cy="34" r="11" fill="#FFFFFF" stroke="#0052CC" stroke-width="2"/>
  <path d="M36 28 A 6 6 0 1 1 30 34" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="30,30 30,35 35,34" fill="#00C7E6"/>
</svg>
